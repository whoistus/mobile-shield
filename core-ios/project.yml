name: MobileShieldCore
options:
  bundleIdPrefix: io.mobileshield
  deploymentTarget:
    iOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MS_VERSION_STRING: "0.1.0"
targets:
  MobileShieldCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources
        headerVisibility: project
        excludes:
          - Public/**
          - PrivacyInfo.xcprivacy
      - path: Sources/Public
        headers:
          - MobileShield.h
          - MobileShieldCore.h
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      configs:
        Debug:
          BUILD_LIBRARY_FOR_DISTRIBUTION: NO
          ENABLE_TESTABILITY: YES
      base:
        PRODUCT_NAME: MobileShieldCore
        PRODUCT_MODULE_NAME: MobileShieldCore
        PRODUCT_BUNDLE_IDENTIFIER: io.mobileshield.core
        MACH_O_TYPE: staticlib
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "$(MS_VERSION_STRING)"
        GCC_PREPROCESSOR_DEFINITIONS: '$(inherited) MS_VERSION=\"$(MS_VERSION_STRING)\"'
        CLANG_ENABLE_MODULES: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  MobileShieldCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MobileShieldCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mobileshield.core.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MobileShieldCore:
    build:
      targets:
        MobileShieldCore: all
    test:
      targets:
        - MobileShieldCoreTests
