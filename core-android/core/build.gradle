plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def versionFile = rootProject.file('../VERSION')
def baseVersion = versionFile.text.trim()
def sdkVersion = baseVersion + (project.findProperty('ms.snapshot') == 'true' ? '-SNAPSHOT' : '')
group = 'io.mobileshield'
version = sdkVersion

android {
    namespace 'io.mobileshield'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Instrumented test compares against VERSION read on the host at build time.
        testInstrumentationRunnerArguments expectedVersion: sdkVersion
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField 'String', 'SDK_VERSION', "\"${sdkVersion}\""
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DMS_VERSION=${sdkVersion}"
            }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake { arguments "-DMSHIELD_DEBUG=ON" }
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'com.scottyab:rootbeer-lib:0.1.1'
    // Ed25519 verification for signed runtime config (no GMS dependency).
    implementation('com.google.crypto.tink:tink-android:1.15.0') {
        exclude group: 'androidx.annotation', module: 'annotation-jvm'
    }
    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM (android.jar only has stubs).
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'io.mobileshield'
                artifactId = 'core'
                version = sdkVersion
                pom {
                    name = 'mobile-shield core'
                    description = 'In-house mobile security SDK (Android core)'
                }
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                def owner = project.findProperty('gpr.owner') ?: 'whoistus'
                url = uri("https://maven.pkg.github.com/${owner}/mobile-shield")
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                    password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.token')
                }
            }
        }
    }
}
