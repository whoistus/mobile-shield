apply plugin: 'com.android.library'

// Follow the host app's compileSdk (React Native library convention). RN 0.72 hosts build with
// AGP 7.4, whose aapt2 cannot load the current android-35 platform jar.
def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'io.mobileshield.reactnative'
    compileSdk safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "io.mobileshield:core:0.1.0"
}
