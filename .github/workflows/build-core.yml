name: build-core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The default 'tools' package was removed from current sdkmanager repos.
          packages: platform-tools

      - name: Install NDK r28
        run: sdkmanager "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"

      - name: Forbidden strings
        run: ./scripts/check-forbidden-strings.sh

      - name: Native host tests (googletest)
        run: |
          command -v ninja >/dev/null || brew install ninja
          ./scripts/test-native-host.sh

      - name: Build AAR (unit tests + publishToMavenLocal)
        run: ./scripts/build-aar.sh

      - name: 16KB alignment check
        run: |
          aar="$(ls core-android/core/build/outputs/aar/*release*.aar | head -n1)"
          ./scripts/check-16kb.sh "$aar"

      - name: iOS unit tests
        run: |
          cd core-ios
          sim="$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+[^(]*\(' | head -1 | sed 's/ *($//')"
          [ -n "$sim" ] || { echo "no iPhone simulator available" >&2; exit 1; }
          xcodebuild test -project MobileShieldCore.xcodeproj -scheme MobileShieldCore \
            -destination "platform=iOS Simulator,name=$sim" \
            MS_VERSION_STRING="$(tr -d '[:space:]' < ../VERSION)"

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Sync binaries into wrappers
        run: ./scripts/sync-binaries.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: core-android/core/build/outputs/aar/*.aar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-unstripped-symbols
          path: core-android/core/build/intermediates/cxx/RelWithDebInfo/*/obj/*/libmobileshield.so
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: core-ios/build/MobileShieldCore.xcframework
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: wrapper-packages
          path: |
            packages/react-native
            packages/flutter

  android-16k-smoke:
    # On-device JNI round-trip on a 16 KB page-size emulator (Linux runner for KVM).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free runner disk space
        # The ps16k AVD needs ~7.4 GB for userdata; a stock ubuntu-latest image leaves ~6.3 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /home/runner
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default 'tools' package was removed from current sdkmanager repos.
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Instrumented test on google_apis_ps16k
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          ndk: 28.2.13676358
          cmake: 3.22.1
          script: cd core-android && ./gradlew :core:connectedDebugAndroidTest
